name: Cache

on:
  workflow_call:
    inputs:
      profile:
        description: Command set to run once the caches are restored.
        type: string
        required: true
      impl:
        description: Primitive seam implementation the build configures.
        type: string
        required: true
      portable:
        description: Restrict primitive seams to their portable paths.
        type: boolean
        required: true
      sanitizer:
        description: Sanitizer suite to run after the tests (empty for none).
        type: string
        required: false
        default: ''
      ubsan_shard:
        description: UBSan shard name (empty for the single run).
        type: string
        required: false
        default: ''
      export:
        description: Hand the archives this run produced to the caller's release job.
        type: boolean
        required: false
        default: false
      benchmark:
        description: Run the benchmark campaign.
        type: boolean
        required: false
        default: false

jobs:
  cached:
    name: Cached run
    runs-on: xcode-27
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: url.https://github.com/rebis-org/.insteadof
      GIT_CONFIG_VALUE_0: https://git.savannah.gnu.org/git/
      GIT_CONFIG_KEY_1: url.https://github.com/rebis-org/.insteadof
      GIT_CONFIG_VALUE_1: git://git.sv.gnu.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
      - id: keys
        name: Resolve cache keys
        env:
          SOURCE_HASH: ${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
        run: |
          zig="$(zig version)"
          vendor="$(git ls-files --stage | awk '$1 == "160000" { print $2, $4 }' | sha256sum | cut -d' ' -f1)"
          cache="$(zig env | sed -n 's/^[[:space:]]*\.global_cache_dir = "\(.*\)",$/\1/p')"
          [ -d "$cache" ] || { echo "unresolved zig global cache: '$cache'" >&2; exit 1; }
          # The vendored build trees bake absolute Homebrew paths into their
          # CMake/configure caches, so the vendor-build cache key must change
          # when the runner image's Homebrew packages change.
          formulae="autoconf automake bison libtool gettext pkg-config cmake boost fmt utf8cpp nlohmann-json libarchive xxhash zstd lz4 lzo xz brotli openssl@3"
          brew="$(brew list --versions $formulae 2>/dev/null | sort | sha256sum | cut -d' ' -f1 || true)"
          {
            echo "zig=$zig"
            echo "vendor=$vendor"
            echo "source=$SOURCE_HASH"
            echo "cache=$cache"
            echo "brew=$brew"
            echo "formulae=$formulae"
          } >> "$GITHUB_OUTPUT"
      - id: global
        uses: ./.github/actions/restore
        with:
          path: ${{ steps.keys.outputs.cache }}
          key: zig-global-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}
          restore-keys: |
            zig-global-${{ runner.os }}-${{ runner.arch }}-
      - id: project
        uses: ./.github/actions/restore
        with:
          path: .zig-cache
          key: zig-project-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ steps.keys.outputs.source }}
          restore-keys: |
            zig-project-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-
      - id: brew
        name: Restore the Homebrew cache
        uses: ./.github/actions/restore
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-
      - id: corpus
        uses: ./.github/actions/restore
        with:
          path: |
            zig-out/benchmark/bin/pkgs
            zig-out/benchmark/corpus
          key: benchmark-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ hashFiles('build/acceptance/benchmark/command.zig', 'build/acceptance/benchmark/env.zig') }}
          restore-keys: |
            benchmark-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-
      - name: Materialize the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: zig build corpus
      - id: gomod
        name: Restore the Go module cache
        if: inputs.profile == 'suite'
        uses: ./.github/actions/restore
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vendor }}-${{ hashFiles('vendor/age/go.sum') }}
      - id: age_ref
        name: Restore the age reference binary
        if: inputs.profile == 'suite'
        uses: ./.github/actions/restore
        with:
          path: /tmp/age_ref
          key: age-ref-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vendor }}
      - name: Build the age reference tool
        if: inputs.profile == 'suite' && steps.age_ref.outputs.cache-hit != 'true'
        run: cd vendor/age && go build -o /tmp/age_ref ./cmd/age
      - name: Save the age reference binary
        uses: ./.github/actions/save
        with:
          path: /tmp/age_ref
          key: age-ref-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vendor }}
          enabled: ${{ inputs.profile == 'suite' && steps.age_ref.outcome == 'success' && steps.age_ref.outputs.cache-hit != 'true' }}
      - id: vendor_build
        name: Restore the vendored build tree
        uses: ./.github/actions/restore
        with:
          path: zig-out/benchmark/build
          key: vendor-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ steps.keys.outputs.brew }}-${{ hashFiles('build/vendor.zig', 'build/acceptance/benchmark/refs.zig') }}-${{ inputs.impl }}-${{ inputs.portable }}-${{ inputs.sanitizer }}${{ inputs.ubsan_shard }}
      - name: Provision the reference toolchains
        run: |
          missing=()
          for formula in ${{ steps.keys.outputs.formulae }}; do
            brew list --versions "$formula" >/dev/null 2>&1 || missing+=("$formula")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            brew install "${missing[@]}"
          fi
          rm -rf /tmp/range-v3
          git init -q /tmp/range-v3
          git -C /tmp/range-v3 remote add origin https://github.com/ericniebler/range-v3.git
          git -C /tmp/range-v3 fetch -q --depth 1 origin 5ba39112d2eafbb3c851a16a537f29b445022998
          git -C /tmp/range-v3 checkout -q FETCH_HEAD
          rm -rf /tmp/date-src /tmp/date_include
          git init -q /tmp/date-src
          git -C /tmp/date-src remote add origin https://github.com/HowardHinnant/date.git
          git -C /tmp/date-src fetch -q --depth 1 origin 43d052df84ab7ed0abfde93c6cc0074da042bdc5
          git -C /tmp/date-src checkout -q FETCH_HEAD
          mkdir -p /tmp/date_include/date
          cp /tmp/date-src/include/date/date.h /tmp/date_include/date/date.h
      - name: Build and package
        if: inputs.profile == 'build'
        run: |
          zig build exe -Doptimize=debug
          zig build exe -Doptimize=safe
          zig build -Doptimize=fast
          zig build -Doptimize=small
          zig build abi
          [ "${{ inputs.benchmark }}" = true ] && zig build benchmark -Doptimize=fast
          brew list --versions llvm >/dev/null 2>&1 || brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          zig build dist -Doptimize=fast
          zig build package -Doptimize=fast
      - name: Export the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.export
        with:
          name: dist
          path: |
            zig-out/*.zip
            zig-out/*.aar
          if-no-files-found: error
          retention-days: 7
      - name: Run the test suites
        if: inputs.profile == 'suite' && inputs.sanitizer == ''
        run: |
          case "${{ inputs.impl }}" in
            onprem|offprem|mergeable) ;;
            *) echo "unknown primitive implementation" >&2; exit 1 ;;
          esac
          zig build unit -Dprimitives_impl=${{ inputs.impl }} -Dportable=${{ inputs.portable }}
          zig build oracles -Dprimitives_impl=${{ inputs.impl }} -Dportable=${{ inputs.portable }} -Doptimize=safe
      - id: ubsan
        name: Restore the UBSan cache
        if: inputs.profile == 'suite' && inputs.sanitizer == 'ubsan'
        uses: ./.github/actions/restore
        with:
          path: .zig-cache-ubsan-${{ inputs.ubsan_shard }}
          key: zig-ubsan${{ inputs.ubsan_shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ steps.keys.outputs.source }}
          restore-keys: |
            zig-ubsan${{ inputs.ubsan_shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-
      - name: Run the sanitizer oracle suite
        if: inputs.profile == 'suite' && inputs.sanitizer == 'ubsan'
        run: |
          case "${{ inputs.ubsan_shard }}" in
            archive) suites="archive" ;;
            codecs) suites="lzma seven_zip tar xz zip zstd inflate" ;;
            kernel) suites="api bound checksum containers interop protocol provider transform" ;;
            *) echo "unknown ubsan shard: '${{ inputs.ubsan_shard }}'" >&2; exit 1 ;;
          esac
          for suite in $suites; do
            zig build ubsan -Dsuite="$suite" --cache-dir ".zig-cache-ubsan-${{ inputs.ubsan_shard }}"
          done
      - name: Save the dependency cache
        uses: ./.github/actions/save
        with:
          path: ${{ steps.keys.outputs.cache }}
          key: ${{ steps.global.outputs.primary-key }}
          enabled: ${{ steps.global.outcome == 'success' && steps.global.outputs.cache-hit != 'true' }}
      - name: Save the project cache
        uses: ./.github/actions/save
        with:
          path: .zig-cache
          key: ${{ steps.project.outputs.primary-key }}
          enabled: ${{ steps.project.outcome == 'success' && steps.project.outputs.cache-hit != 'true' }}
      - name: Save the UBSan cache
        uses: ./.github/actions/save
        with:
          path: .zig-cache-ubsan-${{ inputs.ubsan_shard }}
          key: ${{ steps.ubsan.outputs.primary-key }}
          enabled: ${{ steps.ubsan.outcome == 'success' && steps.ubsan.outputs.cache-hit != 'true' }}
      - name: Save the vendored build tree
        uses: ./.github/actions/save
        with:
          path: zig-out/benchmark/build
          key: vendor-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ steps.keys.outputs.brew }}-${{ hashFiles('build/vendor.zig', 'build/acceptance/benchmark/refs.zig') }}-${{ inputs.impl }}-${{ inputs.portable }}-${{ inputs.sanitizer }}${{ inputs.ubsan_shard }}
          enabled: ${{ steps.vendor_build.outcome == 'success' && steps.vendor_build.outputs.cache-hit != 'true' }}
      - name: Save the benchmark cache
        uses: ./.github/actions/save
        with:
          path: |
            zig-out/benchmark/bin/pkgs
            zig-out/benchmark/corpus
          key: ${{ steps.corpus.outputs.primary-key }}
          enabled: ${{ steps.corpus.outcome == 'success' && steps.corpus.outputs.cache-hit != 'true' }}
      - name: Save the Homebrew cache
        uses: ./.github/actions/save
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ steps.brew.outputs.primary-key }}
          enabled: ${{ steps.brew.outcome == 'success' && steps.brew.outputs.cache-hit != 'true' }}
      - name: Save the Go module cache
        if: inputs.profile == 'suite'
        uses: ./.github/actions/save
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.gomod.outputs.primary-key }}
          enabled: ${{ steps.gomod.outcome == 'success' && steps.gomod.outputs.cache-hit != 'true' }}
      - name: Report cache effectiveness
        if: ${{ !cancelled() }}
        run: |
          {
            echo "| cache | restored |"
            echo "| --- | --- |"
            echo "| dependency | $([[ "${{ steps.global.outputs.cache-hit }}" == true ]] && echo hit || echo miss) |"
            echo "| project | $([[ "${{ steps.project.outputs.cache-hit }}" == true ]] && echo hit || echo miss) |"
            echo "| homebrew | $([[ "${{ steps.brew.outputs.cache-hit }}" == true ]] && echo hit || echo miss) |"
            echo "| benchmark | $([[ "${{ steps.corpus.outputs.cache-hit }}" == true ]] && echo hit || echo miss) |"
            echo "| ubsan | $([[ "${{ steps.ubsan.outputs.cache-hit }}" == true ]] && echo hit || echo miss) |"
          } >> "$GITHUB_STEP_SUMMARY"
