name: Cache

on:
  workflow_call:
    inputs:
      profile:
        description: Command set to run once the caches are restored.
        type: string
        required: true
      impl:
        description: Primitive seam implementation the build configures.
        type: string
        required: true
      portable:
        description: Restrict primitive seams to their portable paths.
        type: boolean
        required: true
      sanitizer:
        description: Sanitizer suite to run after the tests (empty for none).
        type: string
        required: false
        default: ''
      ubsan_shard:
        description: UBSan shard name (empty for the single run).
        type: string
        required: false
        default: ''
      export:
        description: Hand the archives this run produced to the caller's release job.
        type: boolean
        required: false
        default: false
      benchmark:
        description: Run the benchmark campaign.
        type: boolean
        required: false
        default: false

jobs:
  cached:
    name: Cached run
    runs-on: xcode-27
    steps:
      - name: Point the nested GNU submodules at the mirrors
        run: |
          git config --global --add url."https://github.com/rebis-org/".insteadOf https://git.savannah.gnu.org/git/
          git config --global --add url."https://github.com/rebis-org/".insteadOf git://git.sv.gnu.org/
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install the toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install: true
          cache: true
      - id: keys
        name: Resolve cache keys
        env:
          SOURCE_HASH: ${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
        run: |
          zig="$(zig version)"
          vendor="$(git ls-files --stage | awk '$1 == "160000" { print $2, $4 }' | sha256sum | cut -d' ' -f1)"
          cache="$(zig env | sed -n 's/^[[:space:]]*\.global_cache_dir = "\(.*\)",$/\1/p')"
          [ -d "$cache" ] || { echo "unresolved zig global cache: '$cache'" >&2; exit 1; }
          {
            echo "zig=$zig"
            echo "vendor=$vendor"
            echo "source=$SOURCE_HASH"
            echo "cache=$cache"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.keys.outputs.cache }}
          key: zig-global-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}
          restore-keys: |
            zig-global-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-
      - id: project
        name: Restore the project cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-project-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ steps.keys.outputs.source }}
          restore-keys: |
            zig-project-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-
      - name: Restore the Homebrew cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-
      - id: corpus
        name: Restore the benchmark cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            zig-out/benchmark/bin/pkgs
            zig-out/benchmark/corpus
          key: benchmark-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ hashFiles('build/acceptance/benchmark/command.zig', 'build/acceptance/benchmark/env.zig') }}
          restore-keys: |
            benchmark-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-
      - name: Restore the Go module cache
        if: inputs.profile == 'suite'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vendor }}-${{ hashFiles('vendor/age/go.sum') }}
      - id: age_ref
        name: Restore the age reference binary
        if: inputs.profile == 'suite'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/age_ref
          key: age-ref-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vendor }}
      - name: Build the age reference tool
        if: inputs.profile == 'suite' && steps.age_ref.outputs.cache-hit != 'true'
        run: cd vendor/age && go build -o /tmp/age_ref ./cmd/age
      - name: Save the age reference binary
        if: ${{ !cancelled() && inputs.profile == 'suite' && steps.age_ref.outcome == 'success' && steps.age_ref.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/age_ref
          key: age-ref-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vendor }}
      - id: vendor_build
        name: Restore the vendored build tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out/benchmark/build
          key: vendor-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ hashFiles('build/vendor.zig', 'build/acceptance/benchmark/refs.zig') }}
      - name: Provision the reference toolchains
        run: |
          brew install autoconf automake bison libtool gettext pkg-config cmake boost fmt utf8cpp nlohmann-json libarchive xxhash zstd lz4 lzo xz brotli openssl@3
          rm -rf /tmp/range-v3
          git init -q /tmp/range-v3
          git -C /tmp/range-v3 remote add origin https://github.com/ericniebler/range-v3.git
          git -C /tmp/range-v3 fetch -q --depth 1 origin 5ba39112d2eafbb3c851a16a537f29b445022998
          git -C /tmp/range-v3 checkout -q FETCH_HEAD
          rm -rf /tmp/date-src /tmp/date_include
          git init -q /tmp/date-src
          git -C /tmp/date-src remote add origin https://github.com/HowardHinnant/date.git
          git -C /tmp/date-src fetch -q --depth 1 origin 43d052df84ab7ed0abfde93c6cc0074da042bdc5
          git -C /tmp/date-src checkout -q FETCH_HEAD
          mkdir -p /tmp/date_include/date
          cp /tmp/date-src/include/date/date.h /tmp/date_include/date/date.h
      - name: Build and package
        if: inputs.profile == 'build'
        run: |
          zig build exe -Doptimize=debug
          zig build exe -Doptimize=safe
          zig build -Doptimize=fast
          zig build -Doptimize=small
          zig build abi
          [ "${{ inputs.benchmark }}" = true ] && zig build benchmark -Doptimize=fast
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          zig build dist -Doptimize=fast
          zig build package -Doptimize=fast
      - name: Export the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.export
        with:
          name: dist
          path: |
            zig-out/*.zip
            zig-out/*.aar
          if-no-files-found: error
          retention-days: 7
      - name: Run the test suites
        if: inputs.profile == 'suite' && inputs.sanitizer == ''
        run: |
          case "${{ inputs.impl }}" in
            onprem|offprem|mergeable) ;;
            *) echo "unknown primitive implementation" >&2; exit 1 ;;
          esac
          zig build corpus
          zig build unit -Dprimitives_impl=${{ inputs.impl }} -Dportable=${{ inputs.portable }}
          zig build oracles -Dprimitives_impl=${{ inputs.impl }} -Dportable=${{ inputs.portable }} -Doptimize=safe
      - id: ubsan
        name: Restore the UBSan cache
        if: inputs.profile == 'suite' && inputs.sanitizer == 'ubsan'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache-ubsan${{ inputs.ubsan_shard }}
          key: zig-ubsan${{ inputs.ubsan_shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ steps.keys.outputs.source }}
          restore-keys: |
            zig-ubsan${{ inputs.ubsan_shard }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-
      - name: Run the sanitizer oracle suite
        if: inputs.profile == 'suite' && inputs.sanitizer == 'ubsan'
        run: |
          zig build corpus
          case "${{ inputs.ubsan_shard }}" in
            archive) suites="archive" ;;
            codecs) suites="lzma seven_zip tar xz zip zstd inflate" ;;
            kernel) suites="api bound checksum containers interop protocol provider transform" ;;
            *) echo "unknown ubsan shard: '${{ inputs.ubsan_shard }}'" >&2; exit 1 ;;
          esac
          for suite in $suites; do
            zig build ubsan -Dsuite="$suite" --cache-dir ".zig-cache-ubsan-${{ inputs.ubsan_shard }}"
          done
      - name: Save the project cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.project.outcome == 'success' && steps.project.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: ${{ steps.project.outputs.cache-primary-key }}
      - name: Save the UBSan cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.ubsan.outcome == 'success' && steps.ubsan.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache-ubsan${{ inputs.ubsan_shard }}
          key: ${{ steps.ubsan.outputs.cache-primary-key }}
      - name: Save the vendored build tree
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.vendor_build.outcome == 'success' && steps.vendor_build.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out/benchmark/build
          key: vendor-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.zig }}-${{ steps.keys.outputs.vendor }}-${{ hashFiles('build/vendor.zig', 'build/acceptance/benchmark/refs.zig') }}
      - name: Save the benchmark cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.corpus.outcome == 'success' && steps.corpus.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            zig-out/benchmark/bin/pkgs
            zig-out/benchmark/corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
