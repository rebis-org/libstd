name: CD

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the benchmark campaign.
        type: boolean
        default: false
      ci:
        description: Run the CI before publishing.
        type: boolean
        default: true

permissions:
  actions: write
  contents: write
  attestations: write
  id-token: write
  artifact-metadata: write

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  cd:
    name: CD
    uses: ./.github/workflows/build.yml
    with:
      publish: true
      benchmark: ${{ inputs.benchmark }}
      scope: ${{ inputs.ci && 'ALL' || 'publish' }}
