name: Release

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run the benchmark campaign.
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  attestations: write
  id-token: write
  artifact-metadata: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: ./.github/workflows/build.yml
    with:
      publish: true
      benchmark: ${{ inputs.benchmark }}