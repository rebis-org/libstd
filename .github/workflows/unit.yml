name: Unit

on:
  workflow_call:
    inputs:
      runner:
        description: The pinned image label to run on.
        type: string
        required: true

jobs:
  run:
    name: Unit run (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: url.https://github.com/rebis-org/.insteadof
      GIT_CONFIG_VALUE_0: https://git.savannah.gnu.org/git/
      GIT_CONFIG_KEY_1: url.https://github.com/rebis-org/.insteadof
      GIT_CONFIG_VALUE_1: git://git.sv.gnu.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
      - name: Run the unit suite natively
        run: zig build unit
      - name: Build the host libraries
        run: zig build exe -Doptimize=safe
