name: Unit

on:
  workflow_call:
    inputs:
      runner:
        description: The pinned image label to run on.
        type: string
        required: true

jobs:
  run:
    name: Unit run (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: true
      - name: Run the unit suite natively
        run: zig build unit
      - name: Build the host libraries
        run: zig build exe -Doptimize=safe
