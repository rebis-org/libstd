name: Build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
      benchmark:
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/cache.yml
    with:
      profile: build
      impl: onprem
      portable: false
      export: ${{ inputs.publish }}
      benchmark: ${{ inputs.benchmark }}

  suite:
    name: Test matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - { impl: onprem, portable: false }
          - { impl: offprem, portable: false }
          - { impl: mergeable, portable: false }
          - { impl: onprem, portable: true }
          - { impl: mergeable, portable: true }
    uses: ./.github/workflows/cache.yml
    with:
      profile: suite
      impl: ${{ matrix.impl }}
      portable: ${{ matrix.portable }}

  publish:
    name: Publish
    needs: [build, suite]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - name: Download the archives
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - id: provenance
        name: Attest the archives
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/libstd.*.zip
            dist/stdk.*.aar
            dist/StdK.*.zip
            dist/stdk.*.zip
          show-summary: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          version="$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon)"
          [[ -n "$version" ]] || { echo "build.zig.zon carries no .version" >&2; exit 1; }
          tag="$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$version-${GITHUB_SHA:0:7}" \
            --notes "Snapshot from $GITHUB_SHA (provenance: $ATTESTATION)." \
            --prerelease \
            --latest=false \
            dist/*.zip \
            dist/*.aar
          [[ "$(gh release view "$tag" --json isImmutable --jq .isImmutable)" == true ]] \
            || { gh release delete "$tag" --yes --cleanup-tag; exit 1; }
          git tag -f -a Stage -m "Staging $version (tag: $tag)." "$GITHUB_SHA"
          git push --force origin refs/tags/Stage

  prune:
    name: Prune caches
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - id: pin
        name: Resolve the toolchain pin
        run: |
          pin="$(sed -n 's/^zig[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' .mise.toml)"
          [ -n "$pin" ] || { echo "no zig pin in .mise.toml" >&2; exit 1; }
          echo "ZIG_VERSION=$pin" >> "$GITHUB_ENV"
      - name: Delete superseded cache entries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --limit 200 --json key,id,lastAccessedAt \
            | jq -r --arg v "$ZIG_VERSION" --arg floor "$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
                '.[] | select(.key | startswith("zig-")) \
                 | select((.key | contains("-" + $v + "-")) | not) \
                 | select(.lastAccessedAt < $floor) \
                 | .id' \
            | while read -r id; do
                if [ -n "$id" ]; then
                  echo "deleting cache $id"
                  gh cache delete "$id"
                fi
              done
