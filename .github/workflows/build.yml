name: Build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
      benchmark:
        type: boolean
        required: false
        default: false
      scope:
        description: Job set to run.
        type: string
        required: false
        default: ALL
  workflow_dispatch:
    inputs:
      scope:
        description: "Job set to run"
        required: true
        type: choice
        default: ALL
        options:
          - ALL
          - build
          - suite
          - targets
          - runtime
          - publish

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'ALL' || inputs.scope == 'build'
    uses: ./.github/workflows/cache.yml
    with:
      profile: build
      impl: onprem
      portable: false
      export: ${{ inputs.publish }}
      benchmark: ${{ inputs.benchmark }}

  suite:
    name: Test matrix
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'ALL' || inputs.scope == 'suite'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { impl: onprem, portable: false, sanitizer: ubsan, ubsan_shard: archive }
          - { impl: onprem, portable: false, sanitizer: ubsan, ubsan_shard: codecs }
          - { impl: onprem, portable: false, sanitizer: ubsan, ubsan_shard: kernel }
          - { impl: offprem, portable: false, sanitizer: "" }
          - { impl: mergeable, portable: false, sanitizer: "" }
          - { impl: onprem, portable: true, sanitizer: "" }
          - { impl: mergeable, portable: true, sanitizer: "" }
    uses: ./.github/workflows/cache.yml
    with:
      profile: suite
      impl: ${{ matrix.impl }}
      portable: ${{ matrix.portable }}
      sanitizer: ${{ matrix.sanitizer }}
      ubsan_shard: ${{ matrix.ubsan_shard }}

  targets:
    name: Support matrix
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'ALL' || inputs.scope == 'targets'
    runs-on: ubuntu-slim
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: url.https://github.com/rebis-org/.insteadof
      GIT_CONFIG_VALUE_0: https://git.savannah.gnu.org/git/
      GIT_CONFIG_KEY_1: url.https://github.com/rebis-org/.insteadof
      GIT_CONFIG_VALUE_1: git://git.sv.gnu.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
      - name: Compile the support matrix
        run: zig build targets

  runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'ALL' || inputs.scope == 'runtime'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        runner: [macos-26, macos-26-intel, ubuntu-26.04, ubuntu-26.04-arm, windows-2025-vs2026, windows-11-vs2026-arm]
    uses: ./.github/workflows/unit.yml
    with:
      runner: ${{ matrix.runner }}

  gate:
    name: Gate
    needs: [build, suite, targets, runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the verification matrix
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -e '
            to_entries | all(.value.result == "success" or .value.result == "skipped")
          ' > /dev/null || { echo "verification matrix is not green" >&2; exit 1; }

  publish:
    name: Publish
    needs: [build, suite, targets, runtime, gate]
    if: (github.event_name == 'workflow_dispatch' && inputs.scope == 'publish') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - id: provenance
        name: Attest the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.aar
            dist/*.zip
          show-summary: false
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION: ${{ steps.provenance.outputs.attestation-url }}
        run: |
          version="$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon)"
          [[ -n "$version" ]] || { echo "build.zig.zon carries no .version" >&2; exit 1; }
          tag="$version-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$version-${GITHUB_SHA:0:7}" \
            --notes "Snapshot from $GITHUB_SHA (provenance: $ATTESTATION)." \
            --prerelease \
            --latest=false \
            dist/*.zip \
            dist/*.aar
          [[ "$(gh release view "$tag" --json isImmutable --jq .isImmutable)" == true ]] \
            || { gh release delete "$tag" --yes --cleanup-tag; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -f -a Stage -m "Staging $version (tag: $tag)." "$GITHUB_SHA"
          git push --force origin refs/tags/Stage

  prune:
    name: Prune caches
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - id: pin
        name: Resolve the toolchain pin
        run: |
          pin="$(sed -n 's/^zig[[:space:]]*=[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' .mise.toml)"
          [ -n "$pin" ] || { echo "no zig pin in .mise.toml" >&2; exit 1; }
          echo "ZIG_VERSION=$pin" >> "$GITHUB_ENV"
      - name: Reap caches down to the size budget
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          budget=$((95 * 1073741824 / 10))
          floor="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          total=0
          gh api "repos/$REPO/actions/caches?per_page=100" --paginate \
              --jq '.actions_caches[] | [.id, .size_in_bytes, .last_accessed_at, .key] | @tsv' \
          | sort -t$'\t' -k3,3r \
          | while IFS=$'\t' read -r id size accessed key; do
              total=$((total + size))
              if [ "$total" -le "$budget" ]; then continue; fi
              [[ "$accessed" > "$floor" ]] && continue
              echo "reaping $((size / 1048576)) MiB (accessed $accessed) $key"
              gh cache delete "$id" || true
            done
